[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-compression"
version = "0.1.0"
description = "Week 1 label-blind audit of description-only tool compression for native function calling."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jacky Wong" }]
dependencies = ["tiktoken==0.14.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tool-compression = "tool_compression.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
